<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContaLeve - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💧</span>
                <h1 class="text-xl font-bold text-gray-800">ContaLeve</h1>
            </div>
            <div class="text-sm text-gray-600">Olá, Utilizador 👋</div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Resumo deste mês</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            
            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Água</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1">8,5 m³</p>
                    </div>
                    <span class="text-3xl">🚰</span>
                </div>
                <p class="text-sm text-green-600 mt-3 font-medium">↓ 12% vs mês anterior</p>
            </div>

            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-yellow-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Eletricidade</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1">185 kWh</p>
                    </div>
                    <span class="text-3xl">⚡</span>
                </div>
                <p class="text-sm text-red-600 mt-3 font-medium">↑ 5% vs mês anterior</p>
            </div>

            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-orange-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Gás</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1">42 kWh</p>
                    </div>
                    <span class="text-3xl"></span>
                </div>
                <p class="text-sm text-green-600 mt-3 font-medium">↓ 8% vs mês anterior</p>
            </div>

        </div>

        <!-- NOVO: Gráfico de Consumos -->
        <div class="bg-white rounded-xl shadow p-6 mb-8">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Evolução dos Consumos (últimos 6 meses)</h3>
            <canvas id="graficoConsumo"></canvas>
        </div>

        <div class="text-center">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                 Registar Nova Leitura
            </button>
        </div>

    </main>

    <script>
        const ctx = document.getElementById('graficoConsumo').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set'],
                datasets: [
                    {
                        label: 'Água (m³)',
                        data: [10, 9.5, 9, 8.8, 9.2, 8.5],
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    },
                    {
                        label: 'Luz (kWh)',
                        data: [170, 175, 180, 190, 185, 185],
                        borderColor: 'rgb(234, 179, 8)',
                        backgroundColor: 'rgba(234, 179, 8, 0.1)',
                        tension: 0.4
                    },
                    {
                        label: 'Gás (kWh)',
                        data: [55, 50, 48, 45, 43, 42],
                        borderColor: 'rgb(249, 115, 22)',
                        backgroundColor: 'rgba(249, 115, 22, 0.1)',
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>

</body>
</html>
