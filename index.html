<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ContaLeve</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
        if (localStorage.getItem('contaleve_darkmode') === 'true') { document.documentElement.classList.add('dark'); }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen pb-20 transition-colors duration-300">

    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b dark:border-gray-700 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💧</span>
                <h1 class="text-xl font-bold text-gray-800 dark:text-white">ContaLeve</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="alternarModo()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700"><span id="icone-modo" class="text-xl">🌙</span></button>
                <span class="text-sm text-gray-600 dark:text-gray-300 font-medium hidden sm:block" id="user-greeting">Olá 👋</span>
                <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-2 px-4 rounded-full shadow transition">Sair</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">Resumo deste mês</h2>

        <!-- NOVO: Secção de Metas de Poupança -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white">🎯 Metas de Poupança</h3>
                <button onclick="abrirModalMeta()" class="text-sm bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-3 py-1 rounded-full font-bold hover:bg-blue-200 transition">+ Definir Meta</button>
            </div>
            <div id="lista-metas" class="space-y-4">
                <p class="text-gray-500 dark:text-gray-400 text-center py-2 text-sm">A carregar metas...</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border-l-4 border-blue-500">
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Água</p>
                <p class="text-3xl font-bold text-gray-800 dark:text-white mt-1" id="val-agua">0 m³</p>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border-l-4 border-yellow-500">
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Eletricidade</p>
                <p class="text-3xl font-bold text-gray-800 dark:text-white mt-1" id="val-luz">0 kWh</p>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border-l-4 border-orange-500">
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Gás</p>
                <p class="text-3xl font-bold text-gray-800 dark:text-white mt-1" id="val-gas">0 kWh</p>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow mb-8">
            <div class="flex border-b dark:border-gray-700">
                <button onclick="mudarAba('pendentes')" id="aba-pendentes" class="flex-1 py-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-600 dark:text-blue-400">⏳ Pendentes</button>
                <button onclick="mudarAba('historico')" id="aba-historico" class="flex-1 py-3 px-4 font-bold text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400">📜 Histórico</button>
            </div>
            <div id="conteudo-pendentes" class="p-6">
                <ul id="lista-pendentes" class="space-y-3"><li class="text-gray-500 dark:text-gray-400 text-center py-4">A carregar...</li></ul>
            </div>
            <div id="conteudo-historico" class="p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800 dark:text-white">Faturas Pagas</h3>
                    <p class="text-sm font-bold text-green-600 bg-green-50 dark:bg-green-900/30 px-3 py-1 rounded-full" id="total-gasto">Total: 0,00 €</p>
                </div>
                <ul id="lista-historico-faturas" class="space-y-3"><li class="text-gray-500 dark:text-gray-400 text-center py-4">A carregar...</li></ul>
            </div>
        </div>
    </main>

    <!-- MODAL: Definir Meta -->
    <div id="modalMeta" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4">🎯 Definir Meta Mensal</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Define quanto queres gastar no máximo este mês.</p>
            
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo</label>
            <select id="meta-tipo" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 mb-4">
                <option value="agua">💧 Água</option>
                <option value="luz">⚡ Eletricidade</option>
                <option value="gas">🔥 Gás</option>
            </select>

            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Valor Máximo (€)</label>
            <input type="number" step="0.01" id="meta-valor" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 mb-6" placeholder="Ex: 50.00">

            <div class="flex justify-end gap-3">
                <button onclick="fecharModalMeta()" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancelar</button>
                <button onclick="guardarMeta()" class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow-md">Guardar Meta</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Leitura Manual (Mantido) -->
    <div id="modalLeitura" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4">Registar Leitura</h3>
            <select id="tipoContador" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 mb-4">
                <option value="agua">💧 Água</option>
                <option value="luz">⚡ Eletricidade</option>
                <option value="gas"> Gás</option>
            </select>
            <input type="number" id="valorContador" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 mb-6" placeholder="Valor do contador">
            <div class="flex justify-end gap-3">
                <button onclick="fecharModais()" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancelar</button>
                <button id="btnGuardar" onclick="guardarLeitura()" class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow-md">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Nova Fatura (Mantido) -->
    <div id="modalFatura" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white"> Nova Fatura</h3>
                <button onclick="fecharModais()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo</label>
                    <select id="fat-tipo" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3">
                        <option value="agua">💧 Água</option>
                        <option value="luz">⚡ Eletricidade</option>
                        <option value="gas"> Gás</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Fornecedor</label>
                    <select id="fat-fornecedor" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3">
                        <option value="EDP">EDP</option><option value="Galp">Galp</option><option value="Endesa">Endesa</option><option value="Goldenergy">Goldenergy</option><option value="Águas de Portugal">Águas de Portugal</option><option value="EPAL">EPAL</option><option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Valor (€)</label><input type="number" step="0.01" id="fat-valor" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3" placeholder="0.00"></div>
                    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Consumo</label><input type="number" id="fat-consumo" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3" placeholder="0"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Data Fatura</label><input type="date" id="fat-data" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3"></div>
                    <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prazo Limite</label><input type="date" id="fat-limite" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3"></div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Referência Multibanco</label><input type="text" id="fat-referencia" class="block w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-3 font-mono tracking-wider" placeholder="123 456 789"></div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="fecharModais()" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancelar</button>
                <button onclick="guardarFatura()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md">Guardar Fatura</button>
            </div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('contaleve_user_id');
        const userName = localStorage.getItem('contaleve_user_nome');

        if (!userId) { window.location.href = 'login.html'; } 
        else { document.getElementById('user-greeting').innerText = 'Olá, ' + userName + ' 👋'; }

        function fazerLogout() { localStorage.removeItem('contaleve_user_id'); localStorage.removeItem('contaleve_user_nome'); window.location.href = 'login.html'; }
        function alternarModo() { const html = document.documentElement; const icone = document.getElementById('icone-modo'); const estaEscuro = html.classList.toggle('dark'); localStorage.setItem('contaleve_darkmode', estaEscuro); icone.innerText = estaEscuro ? '☀️' : '🌙'; }
        if (localStorage.getItem('contaleve_darkmode') === 'true') { document.getElementById('icone-modo').innerText = '☀️'; }

        function fecharModais() { document.getElementById('modalLeitura').classList.add('hidden'); document.getElementById('modalFatura').classList.add('hidden'); }
        function abrirModalLeitura() { document.getElementById('modalLeitura').classList.remove('hidden'); }
        function abrirModalFatura() { document.getElementById('modalFatura').classList.remove('hidden'); }
        
        function fecharModalMeta() { document.getElementById('modalMeta').classList.add('hidden'); }
        function abrirModalMeta() { document.getElementById('modalMeta').classList.remove('hidden'); }

        function mudarAba(aba) {
            const pendentes = document.getElementById('conteudo-pendentes'); const historico = document.getElementById('conteudo-historico');
            const abaPendentes = document.getElementById('aba-pendentes'); const abaHistorico = document.getElementById('aba-historico');
            if (aba === 'pendentes') { pendentes.classList.remove('hidden'); historico.classList.add('hidden'); abaPendentes.classList.add('border-b-2', 'border-blue-500', 'text-blue-600', 'dark:text-blue-400'); abaPendentes.classList.remove('text-gray-500', 'dark:text-gray-400'); abaHistorico.classList.remove('border-b-2', 'border-blue-500', 'text-blue-600', 'dark:text-blue-400'); abaHistorico.classList.add('text-gray-500', 'dark:text-gray-400'); } 
            else { pendentes.classList.add('hidden'); historico.classList.remove('hidden'); abaHistorico.classList.add('border-b-2', 'border-blue-500', 'text-blue-600', 'dark:text-blue-400'); abaHistorico.classList.remove('text-gray-500', 'dark:text-gray-400'); abaPendentes.classList.remove('border-b-2', 'border-blue-500', 'text-blue-600', 'dark:text-blue-400'); abaPendentes.classList.add('text-gray-500', 'dark:text-gray-400'); carregarHistoricoFaturas(); }
        }

        function diasRestantes(dataLimite) { if (!dataLimite) return 999; const hoje = new Date(); hoje.setHours(0,0,0,0); const prazo = new Date(dataLimite); return Math.ceil((prazo - hoje) / (1000 * 60 * 60 * 24)); }
        function formatarData(dataStr) { if (!dataStr) return '--/--/----'; const partes = dataStr.split('-'); if(partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`; return dataStr; }

        // NOVO: Lógica de Metas
        async function carregarMetas() {
            try {
                // 1. Buscar as metas definidas
                const resMetas = await fetch('/api/metas?user_id=' + userId);
                const metas = await resMetas.json();
                
                // 2. Buscar os gastos reais deste mês (faturas pagas)
                const resGastos = await fetch('/api/historico-faturas?user_id=' + userId);
                const faturas = await resGastos.json();
                
                const lista = document.getElementById('lista-metas');
                
                // Calcular totais por tipo
                let gastos = { agua: 0, luz: 0, gas: 0 };
                faturas.forEach(f => { if(gastos[f.tipo] !== undefined) gastos[f.tipo] += f.valor_total; });

                if (metas.length === 0) {
                    lista.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-center py-2 text-sm">Ainda não definiste metas. Clica em "+ Definir Meta" para começar!</p>';
                    return;
                }

                lista.innerHTML = metas.map(m => {
                    const gasto = gastos[m.tipo] || 0;
                    const percentagem = Math.min((gasto / m.valor_meta) * 100, 100);
                    
                    let corBarra = 'bg-green-500';
                    let corTexto = 'text-green-600 dark:text-green-400';
                    let estado = 'No bom caminho!';
                    
                    if (percentagem >= 100) { corBarra = 'bg-red-500'; corTexto = 'text-red-600 dark:text-red-400'; estado = 'Meta ultrapassada!'; }
                    else if (percentagem >= 80) { corBarra = 'bg-yellow-500'; corTexto = 'text-yellow-600 dark:text-yellow-400'; estado = 'Atenção ao limite!'; }

                    const icones = { agua: '💧', luz: '⚡', gas: '' };

                    return `
                    <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xl">${icones[m.tipo]}</span>
                                <span class="font-bold text-gray-800 dark:text-white capitalize">${m.tipo}</span>
                            </div>
                            <span class="font-bold ${corTexto}">${gasto.toFixed(2)}€ / ${m.valor_meta.toFixed(2)}€</span>
                        </div>
                        <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5 mb-1">
                            <div class="${corBarra} h-2.5 rounded-full transition-all duration-500" style="width: ${percentagem}%"></div>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 text-right">${estado} (${percentagem.toFixed(0)}%)</p>
                    </div>`;
                }).join('');
            } catch (e) { console.error('Erro metas:', e); }
        }

        async function guardarMeta() {
            const tipo = document.getElementById('meta-tipo').value;
            const valor = parseFloat(document.getElementById('meta-valor').value);
            if (!valor || valor <= 0) { alert('⚠️ Insere um valor válido.'); return; }
            
            try {
                await fetch('/api/metas?user_id=' + userId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo, valor_meta: valor }) });
                alert('🎯 Meta definida!');
                fecharModalMeta();
                document.getElementById('meta-valor').value = '';
                carregarMetas();
            } catch (e) { alert('Erro: ' + e.message); }
        }

        async function carregarDados() {
            try {
                const resposta = await fetch('/api/leituras?user_id=' + userId);
                const dados = await resposta.json();
                let agua = '0 m³', luz = '0 kWh', gas = '0 kWh';
                dados.forEach(d => { if(d.tipo === 'agua') agua = d.valor_atual + ' ' + d.unidade; if(d.tipo === 'luz') luz = d.valor_atual + ' ' + d.unidade; if(d.tipo === 'gas') gas = d.valor_atual + ' ' + d.unidade; });
                document.getElementById('val-agua').innerText = agua; document.getElementById('val-luz').innerText = luz; document.getElementById('val-gas').innerText = gas;
            } catch (e) { console.error('Erro:', e); }
        }

        async function carregarHistorico() {
            try {
                const resposta = await fetch('/api/historico?user_id=' + userId);
                const dados = await resposta.json();
                const lista = document.getElementById('lista-historico');
                if (dados.length === 0) { lista.innerHTML = '<li class="text-gray-500 dark:text-gray-400 text-center py-4">Ainda sem leituras. Regista a tua primeira!</li>'; return; }
                const icones = { agua: '💧', luz: '⚡', gas: '🔥' };
                const cores = { agua: 'bg-blue-50 dark:bg-blue-900/20', luz: 'bg-yellow-50 dark:bg-yellow-900/20', gas: 'bg-orange-50 dark:bg-orange-900/20' };
                lista.innerHTML = dados.map(d => `<li class="flex justify-between items-center p-3 rounded-lg ${cores[d.tipo]}"><div class="flex items-center gap-3"><span class="text-xl">${icones[d.tipo]}</span><div><p class="font-bold text-gray-800 dark:text-white capitalize">${d.tipo}</p><p class="text-xs text-gray-500 dark:text-gray-400">${d.data_leitura}</p></div></div><p class="font-bold text-gray-800 dark:text-white">${d.valor_atual} <span class="text-xs font-normal">${d.unidade}</span></p></li>`).join('');
            } catch (e) { console.error('Erro:', e); }
        }

        async function carregarPendentes() {
            try {
                const resposta = await fetch('/api/pendentes?user_id=' + userId);
                const dados = await resposta.json();
                const lista = document.getElementById('lista-pendentes');
                if (dados.length === 0) { lista.innerHTML = '<li class="text-green-600 dark:text-green-400 text-center py-4 font-bold">✅ Não tens faturas pendentes!</li>'; return; }
                const icones = { agua: '💧', luz: '', gas: '🔥' };
                lista.innerHTML = dados.map(f => {
                    const dias = diasRestantes(f.data_limite); let corFundo = 'bg-gray-50 dark:bg-gray-700/50'; let aviso = '';
                    if (dias < 0) { corFundo = 'bg-red-100 dark:bg-red-900/30 border-l-4 border-red-500'; aviso = `️ Atrasada há ${Math.abs(dias)} dias!`; } else if (dias <= 3) { corFundo = 'bg-red-50 dark:bg-red-900/20 border-l-4 border-orange-500'; aviso = `🔥 Vence em ${dias} dia(s)!`; } else if (dias <= 7) { corFundo = 'bg-yellow-50 dark:bg-yellow-900/20 border-l-4 border-yellow-500'; aviso = `⏳ Vence em ${dias} dias`; }
                    return `<li class="flex justify-between items-center p-4 rounded-lg ${corFundo} shadow-sm"><div class="flex-1"><div class="flex items-center gap-2"><span class="text-xl">${icones[f.tipo] || '🧾'}</span><p class="font-bold text-gray-800 dark:text-white">${f.fornecedor}</p></div><p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Prazo: ${formatarData(f.data_limite)} ${aviso ? '- <b class="text-red-600 dark:text-red-400">'+aviso+'</b>' : ''}</p><p class="text-xs font-mono text-gray-400 mt-1">Ref: ${f.referencia_pagamento || '---'}</p></div><div class="text-right flex flex-col items-end gap-2"><p class="text-xl font-bold text-gray-800 dark:text-white">${f.valor_total.toFixed(2)}€</p><button onclick="marcarPaga('${f.id}')" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1 px-3 rounded-full transition">Pagar</button></div></li>`;
                }).join('');
            } catch (e) { console.error('Erro:', e); }
        }

        async function carregarHistoricoFaturas() {
            try {
                const resposta = await fetch('/api/historico-faturas?user_id=' + userId);
                const dados = await resposta.json();
                const lista = document.getElementById('lista-historico-faturas');
                if (dados.length === 0) { lista.innerHTML = '<li class="text-gray-500 dark:text-gray-400 text-center py-4">Ainda não pagaste nenhuma fatura.</li>'; document.getElementById('total-gasto').innerText = 'Total: 0,00 €'; return; }
                const icones = { agua: '💧', luz: '⚡', gas: '🔥' }; let total = 0;
                lista.innerHTML = dados.map(f => { total += f.valor_total || 0; return `<li class="flex justify-between items-center p-3 rounded-lg bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500"><div class="flex items-center gap-3"><span class="text-xl">${icones[f.tipo] || '🧾'}</span><div><p class="font-bold text-gray-800 dark:text-white">${f.fornecedor}</p><p class="text-xs text-gray-500 dark:text-gray-400">${formatarData(f.data_fatura)}</p></div></div><p class="text-lg font-bold text-green-700 dark:text-green-400">${f.valor_total.toFixed(2)}€</p></li>`; }).join('');
                document.getElementById('total-gasto').innerText = `Total: ${total.toFixed(2)} €`;
            } catch (e) { console.error('Erro:', e); }
        }

        async function marcarPaga(id) { if(!confirm('Confirmas que pagaste esta fatura?')) return; try { await fetch('/api/pagar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) }); carregarPendentes(); carregarHistoricoFaturas(); carregarMetas(); } catch (e) { alert('Erro ao marcar.'); } }

        async function guardarLeitura() {
            const tipo = document.getElementById('tipoContador').value; const valor = document.getElementById('valorContador').value; const btn = document.getElementById('btnGuardar');
            if (!valor) { alert('⚠️ Escreve um valor.'); return; }
            btn.innerText = 'A guardar...'; btn.disabled = true;
            try { const resposta = await fetch('/api/leitura', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, tipo: tipo, valor: valor }) }); const dados = await resposta.json(); if (dados.sucesso) { alert('✅ Leitura guardada!'); fecharModais(); document.getElementById('valorContador').value = ''; carregarDados(); carregarHistorico(); } } catch (erro) { alert('Erro: ' + erro.message); } finally { btn.innerText = 'Guardar'; btn.disabled = false; }
        }

        async function guardarFatura() {
            const dados = { user_id: userId, tipo: document.getElementById('fat-tipo').value, fornecedor: document.getElementById('fat-fornecedor').value, valor: parseFloat(document.getElementById('fat-valor').value) || 0, consumo: parseFloat(document.getElementById('fat-consumo').value) || 0, data_fatura: document.getElementById('fat-data').value, data_limite: document.getElementById('fat-limite').value, referencia: document.getElementById('fat-referencia').value };
            if (!dados.valor || !dados.data_fatura) { alert('️ Preenche o Valor e a Data.'); return; }
            try { const resposta = await fetch('/api/fatura', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) }); if (resposta.ok) { alert('🎉 Fatura guardada!'); fecharModais(); document.getElementById('fat-valor').value = ''; document.getElementById('fat-consumo').value = ''; document.getElementById('fat-referencia').value = ''; carregarPendentes(); carregarMetas(); } } catch (err) { alert('Erro: ' + err.message); }
        }

        window.onload = () => { carregarDados(); carregarHistorico(); carregarPendentes(); carregarMetas(); };
    </script>
</body>
</html>
