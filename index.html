<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContaLeve - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <nav class="bg-white shadow-sm border-b sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💧</span>
                <h1 class="text-xl font-bold text-gray-800">ContaLeve</h1>
            </div>
            <div class="text-sm text-gray-600">Olá, Utilizador </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Resumo deste mês</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Água</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="val-agua">8,5 m³</p>
                    </div>
                    <span class="text-3xl">🚰</span>
                </div>
                <p class="text-sm text-green-600 mt-3 font-medium">↓ 12% vs mês anterior</p>
            </div>

            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-yellow-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Eletricidade</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="val-luz">185 kWh</p>
                    </div>
                    <span class="text-3xl">⚡</span>
                </div>
                <p class="text-sm text-red-600 mt-3 font-medium">↑ 5% vs mês anterior</p>
            </div>

            <div class="bg-white rounded-xl shadow p-5 border-l-4 border-orange-500">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Gás</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="val-gas">42 kWh</p>
                    </div>
                    <span class="text-3xl">🔥</span>
                </div>
                <p class="text-sm text-green-600 mt-3 font-medium">↓ 8% vs mês anterior</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow p-6 mb-8">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Evolução dos Consumos</h3>
            <canvas id="graficoConsumo"></canvas>
        </div>
    </main>

    <!-- Botão Flutuante -->
    <button onclick="abrirModal()" class="fixed bottom-8 right-8 bg-blue-600 hover:bg-blue-700 text-white rounded-full p-4 shadow-2xl transition transform hover:scale-110 flex items-center justify-center w-16 h-16">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- Popup (Modal) -->
    <div id="modalLeitura" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Registar Leitura</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Contador</label>
            <select id="tipoContador" class="block w-full border border-gray-300 rounded-lg shadow-sm p-3 mb-4 focus:ring-blue-500 focus:border-blue-500">
                <option value="agua">💧 Água</option>
                <option value="luz">⚡ Eletricidade</option>
                <option value="gas">🔥 Gás</option>
            </select>

            <label class="block text-sm font-medium text-gray-700 mb-1">Valor Atual do Contador</label>
            <input type="number" id="valorContador" class="block w-full border border-gray-300 rounded-lg shadow-sm p-3 mb-6 focus:ring-blue-500 focus:border-blue-500" placeholder="Ex: 150">

            <div class="flex justify-end gap-3">
                <button onclick="fecharModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>
                <button id="btnGuardar" onclick="guardarLeitura()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition shadow-md">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Gráfico (mantido igual)
        const ctx = document.getElementById('graficoConsumo').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set'],
                datasets: [
                    { label: 'Água (m³)', data: [10, 9.5, 9, 8.8, 9.2, 8.5], borderColor: 'rgb(59, 130, 246)', tension: 0.4 },
                    { label: 'Luz (kWh)', data: [170, 175, 180, 190, 185, 185], borderColor: 'rgb(234, 179, 8)', tension: 0.4 },
                    { label: 'Gás (kWh)', data: [55, 50, 48, 45, 43, 42], borderColor: 'rgb(249, 115, 22)', tension: 0.4 }
                ]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
        });

        // Funções do Popup
        function abrirModal() { document.getElementById('modalLeitura').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalLeitura').classList.add('hidden'); }

        // NOVO: Função para enviar dados à API
        async function guardarLeitura() {
            const tipo = document.getElementById('tipoContador').value;
            const valor = document.getElementById('valorContador').value;
            const btn = document.getElementById('btnGuardar');

            if (!valor) {
                alert('️ Por favor, escreve um valor.');
                return;
            }

            // Mudar o botão para mostrar que está a trabalhar
            btn.innerText = 'A guardar...';
            btn.disabled = true;

            try {
                // Enviar para a nossa API na Cloudflare
                const resposta = await fetch('/api/leitura', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipo, valor: valor })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    alert('✅ Sucesso! Leitura de ' + valor + ' guardada na base de dados.');
                    document.getElementById('valorContador').value = '';
                    fecharModal();
                } else {
                    alert('❌ Erro ao guardar: ' + dados.erro);
                }
            } catch (erro) {
                alert('❌ Erro de conexão: ' + erro.message);
            } finally {
                // Voltar o botão ao normal
                btn.innerText = 'Guardar';
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
